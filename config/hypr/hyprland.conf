
$left_mon = HDMI-A-1
$right_mon = HDMI-A-2

monitor = $left_mon, 3840x2160@60, 0x0, 1.25
monitor = $right_mon, 3840x2160@60, 3072x0, 1.25

$terminal = wezterm
$fileManager = dolphin

# $menu = wofi --show drun
# $menu2 = wofi --show run
# $menu = hyprlauncher

env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = GDK_BACKEND,wayland
env = QT_QPA_PLATFORM,wayland
env = SDL_VIDEODRIVER,wayland,x11
env = CLUTTER_BACKEND,wayland

env = GTK_THEME,Adwaita:dark
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24

env = QT_QPA_PLATFORMTHEME,qt6ct
# env = QT_STYLE_OVERRIDE,kvantum

env = GDK_scale,1.25
env = QT_SCALE_FACTOR,1.25

exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = nm-applet &
exec-once = waybar &
exec-once = hyprpaper &
exec-once = spotify &
exec-once = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"
exec-once = gsettings set org.gnome.desktop.interface gtk-theme "prefer-dark"
exec-once = hypridle
exec-once = hyprlauncher --daemon &
exec-once = wezterm start --class btop -- btop
exec-once = wezterm start --class quikshell
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = openrgb --startminimized --profile /home/dere/.config/OpenRGB/Emerald\ Aeternal.orp &


general {
    gaps_in = 8
    gaps_out = 20

    border_size = 3

    col.active_border = rgba(11eeffee) rgba(00ff66ee) 45deg
    col.inactive_border = rgba(295969aa)

    resize_on_border = true

    allow_tearing = false

    layout = master

    # animation = global, 1, 3.3, default, popin 65%
}

misc {
    # move_floating_windows = true
}

workspace =

animations {
    bezier = easeOutQuint, 0.22, 1, 0.36, 1
    bezier = easeInOutCubic, 0.65, 0, 0.35, 1
    bezier = easeOutCubic, 0.33, 1, 0.68, 1
    bezier = easeOutCirc, 0, 0.55, 0.45, 1

    animation = global, 1, 3.3, easeOutQuint
    animation = workspaces, 1, 2, easeOutCubic, slidefade
    animation = workspacesIn, 1, 5, easeOutCubic, slidefade
    animation = workspacesOut, 1, 5, easeOutCubic, slidefade
    animation = specialWorkspace, 1, 6, easeOutCubic, fade
    animation = windowsIn, 1, 7, easeInOutCubic, popin 65%
    animation = windowsMove, 1, 7, easeInOutCubic, popin 65%
}

decoration {
    rounding = 8
    rounding_power = 8

    active_opacity = 1.0
    inactive_opacity = 0.8

    shadow {
        enabled = true
        range = 19
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 3
        vibrancy = 0.9696
    }
}

workspace = 1, defaultName:term
workspace = 2, defaultName:browse
workspace = 3, defaultName:game
workspace = 4, defaultName:comm

windowrule {
  name = spotify-rule
  float = on
  size = (monitor_w*0.7) (monitor_h*0.7)
  center = on
  workspace = special:music silent
  match:class = (?i)^(spotify)$
}


windowrule {
  name = btop-rule
  float = on
  size = (monitor_w*0.7) (monitor_h*0.7)
  center = on
  workspace = special:system-monitor silent
  match:class = ^(btop)$
}


windowrule {
  name = quikshell-rule
  float = on
  size = (monitor_w*0.7) (monitor_h*0.7)
  center = on
  workspace = special:quikshell silent
  match:class = ^(quikshell)$
}

